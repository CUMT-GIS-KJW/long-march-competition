<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册｜红图绘长征</title>
  <link rel="stylesheet" href="/features/login/frontend/login.css">
  <link rel="stylesheet" href="/features/login/frontend/register.css">
  <link rel="stylesheet" href="/features/shared/frontend/ui-polish.css">
</head>
<body>
  <main class="login-page">
    <section class="login-hero" aria-label="红图绘长征注册界面">
      <div class="login-title">
        <span>WEBGIS COMPETITION SYSTEM</span>
        <div class="login-title-main">
          <img class="brand-logo" src="/assets/images/home-poster/logal-display.png" alt="">
          <h1>红图绘长征</h1>
        </div>
        <p>长征路线 WebGIS 测绘展示系统</p>
      </div>
      <div class="login-slogan">
        <img src="/assets/images/home-poster/slogan.png" alt="重温峥嵘岁月 传承长征精神">
      </div>

      <section class="login-card register-card">
        <div class="login-card-mark" aria-hidden="true">
          <img src="/assets/images/home-poster/logal-display.png" alt="">
        </div>
        <div class="login-card-head">
          <span>USER REGISTER</span>
          <h2>用户注册</h2>
        </div>

        <form id="registerForm" class="login-form">
          <label>
            <span>账号</span>
            <input id="username" type="text" placeholder="3-50个字符" required>
          </label>
          <label>
            <span>密码</span>
            <input id="password" type="password" placeholder="至少6位" required>
          </label>
          <!-- 去掉确认密码行 -->
          <button type="submit">立即注册</button>
          <p id="registerMessage" class="login-message" aria-live="polite"></p>
        </form>

        <div class="login-actions">
          <a href="/features/login/frontend/index.html">已有账号？去登录</a>
        </div>

        <div class="login-modules">
          <span>二维主地图</span>
          <span>综合分析</span>
          <span>3D 地形</span>
          <span>红色研学</span>
          <span>AI 智能体</span>
        </div>
      </section>
      <img class="login-flag" src="/assets/images/home-poster/right-flag.png" alt="" aria-hidden="true">
      <img class="login-mountains" src="/assets/images/home-poster/map-mountains.png" alt="" aria-hidden="true">
    </section>
  </main>

  <script src="/features/login/frontend/register.js"></script>
</body>
</html>
