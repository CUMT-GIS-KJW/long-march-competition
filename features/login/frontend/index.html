<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录｜红图绘长征</title>
  <link rel="stylesheet" href="/features/login/frontend/login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-hero" aria-label="红图绘长征登录界面">
      <div class="login-title">
        <span>WEBGIS COMPETITION SYSTEM</span>
        <div class="login-title-main">
          <img class="brand-logo" src="/assets/images/home-poster/logal.png" alt="">
          <h1>红图绘长征</h1>
        </div>
        <p>长征路线 WebGIS 测绘展示系统</p>
      </div>
      <div class="login-slogan">
        <img src="/assets/images/home-poster/slogan.png" alt="重温峥嵘岁月 传承长征精神">
      </div>

      <section class="login-card">
        <div class="login-card-mark" aria-hidden="true">
          <img src="/assets/images/home-poster/logal.png" alt="">
        </div>
        <div class="login-card-head">
          <span>USER LOGIN</span>
          <h2>系统登录</h2>
        </div>

        <form id="loginForm" class="login-form">
          <label>
            <span>账号</span>
            <input id="username" type="text" autocomplete="username" value="admin">
          </label>
          <label>
            <span>密码</span>
            <input id="password" type="password" autocomplete="current-password" value="123456">
          </label>
          <button type="submit">登录系统</button>
          <p id="loginMessage" class="login-message" aria-live="polite"></p>
        </form>

        <div class="login-modules">
          <span>二维主地图</span>
          <span>综合分析</span>
          <span>3D 地形</span>
          <span>红色研学</span>
          <span>AI 智能体</span>
        </div>
      </section>
      <img class="login-flag" src="/assets/images/home-poster/right-flag.png" alt="" aria-hidden="true">
      <img class="login-mountains" src="/assets/images/home-poster/map-mountains.png" alt="" aria-hidden="true">
    </section>
  </main>

  <script src="/features/login/frontend/login.js"></script>
</body>
</html>
