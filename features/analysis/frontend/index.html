<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>长征路线 GIS 综合分析平台</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/features/shared/frontend/base.css">
  <link rel="stylesheet" href="/features/analysis/frontend/analysis.css">
  <link rel="stylesheet" href="/features/analysis/frontend/warm-theme.css">
  <link rel="stylesheet" href="/features/shared/frontend/home-layout-theme.css">
</head>
<body>
  <script src="/features/shared/frontend/auth-check.js"></script>
  <div class="analysis-app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/assets/images/home-poster/logal.png" alt="">
        <div class="seal">析</div>
        <div>
          <h1>长征路线 GIS 综合分析平台</h1>
          <small>ROUTE / TERRAIN / BUFFER / RESOURCE</small>
        </div>
      </div>

      <nav class="topnav site-nav">
        <button class="site-nav-btn" type="button" onclick="location.href='/index.html'">二维主地图</button>
        <button class="site-nav-btn site-nav-active" type="button">综合分析</button>
        <button class="site-nav-btn" type="button" onclick="location.href='/scene3d.html'">3D地形</button>
        <button class="site-nav-btn" type="button" onclick="location.href='/tourism.html'">红色旅游</button>
      </nav>

      <div class="system-state">
        <i class="state-dot"></i>
        <span id="taskState">等待分析</span>
      </div>
    </header>

    <main class="analysis-grid">
      <aside class="tools-panel">
        <p class="section-label">空间分析工具箱</p>

        <div class="tool-list" id="toolList">
          <button class="active" type="button" data-tool="route">
            <i>线</i>
            <span><b>路线统计分析</b><small>里程 / 省域 / 选线原因</small></span>
          </button>
          <button type="button" data-tool="compare">
            <i>比</i>
            <span><b>多路线对比分析</b><small>里程 / 密度 / 难度排行</small></span>
          </button>
          <button type="button" data-tool="difficulty">
            <i>险</i>
            <span><b>地形难度指数</b><small>DEM / 坡度 / 分段着色</small></span>
          </button>
          <button type="button" data-tool="terrain">
            <i>高</i>
            <span><b>地形起伏分析</b><small>全军团高程 / 结构对比</small></span>
          </button>
          <button type="button" data-tool="buffer">
            <i>缓</i>
            <span><b>多尺度缓冲分析</b><small>5 / 10 / 20 km 图层接口</small></span>
          </button>
          <button type="button" data-tool="node">
            <i>点</i>
            <span><b>节点类型统计</b><small>战斗 / 会议 / 渡江 / 会师</small></span>
          </button>
          <button type="button" data-tool="resource">
            <i>热</i>
            <span><b>红色资源关联</b><small>资源热点 / 沿线关联</small></span>
          </button>
        </div>

        <div class="parameter-panel">
          <p class="section-label">模型参数</p>
          <label>
            分析路线
            <select id="routeSelect"></select>
          </label>
          <label class="buffer-radius-field" id="bufferRadiusField">
            缓冲半径
            <select id="bufferSelect">
              <option value="5">5 km：核心步行研学圈</option>
              <option value="10">10 km：短驳可达圈</option>
              <option value="20">20 km：县域联动圈</option>
            </select>
          </label>
          <div class="layer-control" id="layerControl">
            <span>图层控制</span>
            <label><input type="checkbox" data-layer="route" checked>路线</label>
            <label><input type="checkbox" data-layer="event" >节点</label>
            <label><input type="checkbox" data-layer="resource">资源</label>
            <label><input type="checkbox" data-layer="hillshade" checked>山体阴影</label>
          </div>
          <button class="run-analysis" type="button" id="runAnalysis">执行 GIS 分析</button>
        </div>
      </aside>

      <section class="analysis-map">
        <div id="analysisMap"></div>
        <div class="map-title-card">
          <span>当前专题</span>
          <b id="mapTheme">路线统计分析</b>
        </div>
        <div class="analysis-legend" id="analysisLegend">
          <b>专题图例</b>
          <span><i class="route-symbol"></i>当前路线</span>
          <span><i class="buffer-symbol"></i>缓冲/热点结果</span>
          <span><i class="resource-symbol"></i>红色资源点</span>
          <span><i class="hillshade-symbol"></i>山体阴影底纹</span>
        </div>
        <div class="map-progress" id="analysisProgress" aria-hidden="true">
          <div class="map-progress-head">
            <span id="progressLabel">GIS 分析准备中</span>
            <b id="progressValue">0%</b>
          </div>
          <div class="map-progress-track">
            <i id="progressBar"></i>
          </div>
          <div class="map-progress-steps" id="progressSteps">
            <span data-progress-step="0">读取数据</span>
            <span data-progress-step="1">空间计算</span>
            <span data-progress-step="2">绘制图层</span>
            <span data-progress-step="3">生成结论</span>
          </div>
        </div>
      </section>

      <aside class="metrics-panel">
        <div class="metrics-head">
          <p class="section-label">专题统计</p>
          <span id="analysisMode">路线统计</span>
        </div>
        <div class="metrics" id="metrics"></div>

        <div class="route-switch" id="terrainRouteButtons"></div>

        <div class="chart-tabs">
          <button class="active" type="button" data-chart="primary">专题统计</button>
          <button type="button" data-chart="secondary">结构对比</button>
        </div>
        <div id="analysisChart"></div>

        <section class="overall-analysis-panel" id="overallAnalysisPanel"></section>
      </aside>
    </main>

    <footer class="conclusion">
      <span class="result-badge">分析结论</span>
      <p id="conclusionText">请选择左侧专题并执行 GIS 分析，系统将解释选线原因、空间难点和应学习的长征精神。</p>
      <div class="result-actions">
        <button id="tableBtn" type="button">查看统计表</button>
      </div>
    </footer>
  </div>

  <div class="analysis-modal" id="analysisModal" aria-hidden="true">
    <div class="analysis-modal-card">
      <button class="modal-close" id="modalCloseBtn" type="button">×</button>
      <h2 id="modalTitle">统计结果</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="/features/shared/frontend/config.js?v=gis-fix3"></script>
  <script src="/features/shared/frontend/data-service.js?v=gis-fix3"></script>
  <script src="/features/shared/frontend/map-utils.js?v=gis-fix3"></script>
  <script src="/features/analysis/frontend/analysis-map.js?v=gis-fix3"></script>
  <script src="/features/analysis/frontend/analysis-ui.js?v=gis-fix3"></script>
</body>
</html>
