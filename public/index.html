<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&#x7ea2;&#x56fe;&#x7ed8;&#x957f;&#x5f81; WebGIS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="stylesheet" href="assets/css/index-enhancements.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar-main">
      <div class="brand-block">
        <strong>&#x7ea2;&#x56fe;&#x7ed8;&#x957f;&#x5f81;</strong>
        <span>&#x957f;&#x5f81;&#x8def;&#x7ebf; WebGIS &#x6d4b;&#x7ed8;&#x5c55;&#x793a;&#x7cfb;&#x7edf;</span>
      </div>

      <button class="scene-entry" id="scene3dEntry">3D &#x5730;&#x5f62;</button>

      <div class="topbar-actions">
        <button id="resetViewBtn">&#x91cd;&#x7f6e;&#x89c6;&#x56fe;</button>
        <button id="legendToggleBtn">&#x56fe;&#x4f8b;</button>
      </div>
    </header>

    <main class="main-layout">
      <aside class="left-panel">
        <section class="control-card fold-card open" id="routeFold">
          <button class="fold-title" data-fold="routeFold">
            <span>&#x8def;&#x7ebf;&#x56fe;&#x5c42;</span>
            <b>&#x2228;</b>
          </button>
          <div class="fold-body route-list" id="routeLayerList"></div>
        </section>

        <section class="control-card fold-card open" id="eventFold">
          <button class="fold-title" data-fold="eventFold">
            <span>&#x91cd;&#x8981;&#x4e8b;&#x4ef6;</span>
            <b>&#x2228;</b>
          </button>
          <div class="fold-body">
            <div class="event-type-buttons" id="eventTypeButtons">
              <button id="eventVisibilityBtn" type="button" data-events-visible="true">隐藏事件点</button>
              <button class="active" data-event-type="all">&#x5168;&#x90e8;</button>
              <button data-event-type="battle">&#x6218;&#x6597;</button>
              <button data-event-type="meeting">&#x4f1a;&#x8bae;</button>
              <button data-event-type="river">&#x6e21;&#x6c5f;</button>
              <button data-event-type="mountain">&#x96ea;&#x5c71;&#x8349;&#x5730;</button>
              <button data-event-type="join">&#x4f1a;&#x5e08;</button>
            </div>
          </div>
        </section>

        <section class="control-card fold-card open" id="resourceFold">
          <button class="fold-title" data-fold="resourceFold">
            <span>&#x7ea2;&#x8272;&#x8d44;&#x6e90;</span>
            <b>&#x2228;</b>
          </button>
          <div class="fold-body resource-list" id="resourceLayerList">
            <label>
              <input type="checkbox" id="tourismLayerToggle" checked>
              <span>&#x663e;&#x793a;&#x7ea2;&#x8272;&#x8d44;&#x6e90;</span>
            </label>
          </div>
        </section>
      </aside>

      <section class="map-wrap">
        <div id="map"></div>
        <div class="map-title">
          <span>1934&#x2014;1936</span>
          <b>&#x957f;&#x5f81;&#x8def;&#x7ebf;&#x4e0e;&#x91cd;&#x8981;&#x4e8b;&#x4ef6;&#x65f6;&#x7a7a;&#x5c55;&#x793a;</b>
        </div>
        <div class="map-legend" id="mapLegend">
          <b>&#x56fe;&#x4f8b;</b>
          <span><i class="legend-route"></i>&#x72ec;&#x7acb;&#x8def;&#x7ebf;&#x56fe;&#x5c42;</span>
          <span><i class="legend-event battle"></i>&#x6218;&#x6597;</span>
          <span><i class="legend-event meeting"></i>&#x4f1a;&#x8bae;</span>
          <span><i class="legend-event river"></i>&#x6e21;&#x6c5f;</span>
          <span><i class="legend-event mountain"></i>&#x96ea;&#x5c71;&#x8349;&#x5730;</span>
          <span><i class="legend-event join"></i>&#x4f1a;&#x5e08;</span>
          <span><i class="legend-tourism"></i>&#x7ea2;&#x8272;&#x8d44;&#x6e90;</span>
        </div>
      </section>

      <aside class="right-detail" id="detailPanel"></aside>
    </main>

    <footer class="bottom-playbar">
      <div class="play-group">
        <span>&#x4e8b;&#x4ef6;&#x64ad;&#x653e;</span>
        <button id="playEventsBtn">&#x64ad;&#x653e;&#x4e8b;&#x4ef6;</button>
        <button id="pauseBtn">&#x6682;&#x505c;</button>
        <button id="prevBtn">&#x4e0a;&#x4e00;&#x4e2a;</button>
        <button id="nextBtn">&#x4e0b;&#x4e00;&#x4e2a;</button>
      </div>

      <div class="play-group route-play-group">
        <span>&#x8def;&#x7ebf;&#x64ad;&#x653e;</span>
        <select id="routeSelect"></select>
        <button id="playRouteBtn">&#x64ad;&#x653e;&#x8def;&#x7ebf;</button>
      </div>

      <div class="play-status">
        <b id="playStatusTitle">&#x7b49;&#x5f85;&#x64ad;&#x653e;</b>
        <input type="range" id="progressRange" min="0" max="100" value="0">
      </div>
    </footer>
  </div>

  <div class="agent-panel" id="agentPanel">
    <button class="agent-toggle" id="agentToggle">AI</button>
    <section class="agent-window">
      <header class="agent-head">
        <span>LONG MARCH GIS AGENT</span>
        <b>长征 GIS 智能体</b>
      </header>
      <div class="agent-messages" id="agentMessages"></div>
      <form class="agent-form" id="agentForm">
        <input id="agentInput" type="text" placeholder="问路线、事件、空间分析……">
        <button type="submit">发送</button>
      </form>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data-service.js"></script>
  <script src="assets/js/index-map.js"></script>
  <script src="assets/js/index-ui.js"></script>
  <script src="assets/js/agent-ui.js"></script>
</body>
</html>
